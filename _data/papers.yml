- number: 1
  category: published
  title: The arithmetic rank of the residual intersections of a complete intersection ideal
  coauthors: ["Manav Batavia", "Taylor Murray", "Vaibhav Pandey"]
  journal: International Mathematics Research Notices
  citation: "(2026), no. 10, rnag091."
  arxiv: https://arxiv.org/abs/2510.17049
  doi: https://doi.org/10.1093/imrn/rnag091
  abstract: |
    <p>The arithmetic rank of an ideal in a polynomial ring over an algebraically closed field is the smallest number of equations needed to define its vanishing locus set-theoretically. We determine the arithmetic rank of the generic \(m\)-residual intersection of an ideal generated by \(n\) indeterminates for all \(m\geq n\) and in every characteristic. We further give an explicit description of its set-theoretic generators.</p>
    <p>Our main result provides a sharp upper bound for the arithmetic rank of any residual intersection of a complete intersection ideal in any Noetherian local ring. In particular, given a complete intersection ideal of height at least two, any of its generic residual intersections—including its generic link—fails to be a set-theoretic complete intersection in characteristic zero.</p>

- number: 2
  category: preprint
  title: Lifting systems for finite length modules
  coauthors: ["Benjamin Katz", "Nawaj KC", "Andrew J. Soto Levins", "Ryan Watson"]
  arxiv: https://arxiv.org/abs/2602.01440
  abstract: |
    <p>This paper is concerned with lifting modules along a surjective map of noetherian local rings, say \(\varphi \colon R \twoheadrightarrow S\). A finitely generated \(R\)-module \(L\) is a naive lift of an \(S\)-module \(M\) if \(L \otimes_R S \cong M\). We are concerned with the maximum depth and dimension among all naive lifts of \(M\), which we call the liftable depth and liftable dimension, respectively, of \(M\) along \(\varphi\).</p>
    <p>We approach this via a notion of lifting systems that we introduce in this paper. We then provide a necessary and sufficient condition for a module of finite length to lift and Serre lift to a regular local ring in terms of lifting systems.</p>

- number: 3
  category: preprint
  title: Cohomological support varieties for monomial ideals
  coauthors: ["Kara Fagerstrom", "Julianne Faur", "Benjamin Katz", "Stephen Stern", "Ryan Watson"]
  arxiv: https://arxiv.org/abs/2605.29103
  abstract: |
    <p>Let \(R\) be a local or positively graded ring with a regular presentation \(R \cong Q/I\) where \(I\) is a monomial ideal generated by \(n\) elements on a regular sequence. In Briggs–Grifo–Pollitz (2025), the authors classify the cohomological support varieties \(\mathcal{V}_R(R)\) for \(n \leqslant 5\). In this paper we extend their results to classify the varieties that can occur as \(\mathcal{V}_R(R)\) for \(n=6\).</p>
    <p>Moreover, we provide two families of rings, one realizing cohomological support varieties of unbounded codimension, the other realizing an unbounded number of components. Finally, we answer a question of Gintz (2026) about the varieties that occur as \(\mathcal{V}_R(R)\) where \(I\) is given by the edge ideal of a cycle.</p>

- number: 4
  category: preprint
  title: The arithmetic rank of nullcones of classical invariant rings
  coauthors: ["Manav Batavia", "Aryaman Maithani"]
  arxiv: https://arxiv.org/abs/2608.29445
  abstract: |
    <p>We compute the arithmetic rank of nullcone ideals arising from natural actions of the special linear, orthogonal, and symplectic groups on direct sums of copies of their standard and dual representations. Over an infinite field of characteristic different from two, we show that the arithmetic rank equals the Krull dimension of the invariant ring, and compute this dimension.</p>
    <p>In positive characteristic, the required lower bounds are not detected by local cohomology, and are obtained using étale cohomology.</p>

